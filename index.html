<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Mini Counter</h1>
      <p id="count" class="count">0</p>

      <div class="buttons">
        <button id="decrease" class="btn secondary">-1</button>
        <button id="reset" class="btn neutral">Reset</button>
        <button id="increase" class="btn primary">+1</button>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
