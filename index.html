<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Target Counter Challenge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Target Counter</h1>

      <p class="target-label">Target</p>
      <p id="target" class="target">0</p>

      <p id="count" class="count">0</p>

      <div class="buttons">
        <button id="decrease" class="btn secondary">-1</button>
        <button id="reset" class="btn neutral">Reset</button>
        <button id="increase" class="btn primary">+1</button>
      </div>

      <div class="secondary-controls">
        <button id="new-target" class="btn accent">New Target</button>
      </div>

      <p id="status" class="status">Reach the target number!</p>
      <p id="score" class="score">Wins: 0</p>
      <p id="streak" class="streak">Streak: 0</p>
      <p id="timer" class="timer">Time: 10</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
